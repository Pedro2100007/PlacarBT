<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Placar Beach Tennis - R12 Beach Sports</title>
  
  <!-- Biblioteca para exportação em Excel (.xls/.xlsx) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent-neon: #00ff88;
      --team1-color: #00d2ff;
      --team2-color: #ff3366;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --font-display: 'Impact', 'Arial Black', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      padding: 12px;
    }

    /* Topo / Barra de Ferramentas */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 10px 20px;
      margin-bottom: 12px;
      border: 1px solid #30363d;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
    }

    .logo-container {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid var(--accent-neon);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
      position: relative;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .logo-fallback {
      display: none;
      color: var(--accent-neon);
      font-weight: 900;
      font-size: 1.1rem;
      font-family: var(--font-display);
      text-align: center;
      line-height: 1;
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .brand-title span {
      color: var(--accent-neon);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-action {
      background: #21262d;
      border: 1px solid #30363d;
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .btn-action:hover {
      background: #30363d;
    }

    .btn-action.btn-accent {
      background: #238636;
      border-color: #2ea043;
    }

    /* Placar Central */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 12px;
    }

    .team-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 2px solid #30363d;
      position: relative;
      overflow: hidden;
    }

    .team-1 { border-top: 6px solid var(--team1-color); }
    .team-2 { border-top: 6px solid var(--team2-color); }

    .team-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #30363d;
      padding-bottom: 8px;
    }

    .team-name-input {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1.5rem;
      font-weight: 800;
      width: 100%;
      outline: none;
      text-transform: uppercase;
    }

    .team-name-input:focus {
      border-bottom: 2px solid var(--accent-neon);
    }

    .serve-indicator {
      font-size: 1.6rem;
      cursor: pointer;
      opacity: 0.15;
      transition: opacity 0.2s, transform 0.2s;
    }

    .serve-indicator.active {
      opacity: 1;
      filter: drop-shadow(0 0 8px #ffeb3b);
      transform: scale(1.15);
    }

    .games-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      margin: 10px 0;
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 700;
    }

    .games-val {
      font-family: var(--font-display);
      font-size: 2.8rem;
      color: #fff;
    }

    /* Ponto Gigante */
    .point-display {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      border-radius: 16px;
      margin: 6px 0 12px 0;
      cursor: pointer;
      border: 1px solid #21262d;
    }

    .point-val {
      font-family: var(--font-display);
      font-size: clamp(6rem, 16vw, 13rem);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -2px;
    }

    .team-1 .point-val { color: var(--team1-color); }
    .team-2 .point-val { color: var(--team2-color); }

    .btn-score-add {
      background: #21262d;
      border: 1px solid #30363d;
      color: #fff;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.1s;
    }

    .btn-score-add:active {
      transform: scale(0.98);
      background: #30363d;
    }

    /* Rodapé / Barra de Atalhos e Undo */
    footer {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #30363d;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .shortcuts-info {
      display: flex;
      gap: 16px;
    }

    .badge {
      background: #21262d;
      border: 1px solid #30363d;
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
      font-weight: bold;
    }

    /* Input oculto para upload de logo */
    #logoFileInput {
      display: none;
    }

    @media (max-width: 650px) {
      main { grid-template-columns: 1fr; }
      .shortcuts-info { display: none; }
    }
  </style>
</head>
<body>

  <!-- Input de arquivo para troca de foto da R12 -->
  <input type="file" id="logoFileInput" accept="image/*" />

  <header>
    <div class="brand" onclick="document.getElementById('logoFileInput').click()" title="Clique para alterar a imagem do logo">
      <div class="logo-container">
        <img 
          id="clubLogo" 
          src="https://lookaside.fbsbx.com/lookaside/crawler/instagram/r12_beach_sports/profile_pic.jpg" 
          alt="R12 Beach Sports" 
          referrerpolicy="no-referrer"
          crossorigin="anonymous"
          onerror="handleLogoError(this)" 
        />
        <div id="logoFallback" class="logo-fallback">R12<br>BEACH</div>
      </div>
      <div class="brand-title">R12 <span>Beach Sports</span></div>
    </div>

    <div class="header-actions">
      <button class="btn-action" onclick="undoLastAction()" title="Desfazer último ponto">
        ↩ Voltar (Undo)
      </button>
      <button class="btn-action" onclick="resetMatch()">
        ↺ Reiniciar
      </button>
      <button class="btn-action btn-accent" onclick="exportToExcel()">
        📊 Salvar .XLS
      </button>
    </div>
  </header>

  <main>
    <!-- DUPLA 1 -->
    <div class="team-card team-1">
      <div class="team-header">
        <input type="text" id="team1Name" class="team-name-input" value="DUPLA 1" maxlength="25" />
        <span id="serve1" class="serve-indicator active" onclick="toggleServe(1)" title="Alternar Saque">🎾</span>
      </div>
      <div class="games-row">
        <span>GAMES:</span>
        <span class="games-val" id="team1Games">0</span>
      </div>
      <div class="point-display" onclick="addPoint(1)">
        <span class="point-val" id="team1Points">0</span>
      </div>
      <button class="btn-score-add" onclick="addPoint(1)">+ PONTO (VOL +)</button>
    </div>

    <!-- DUPLA 2 -->
    <div class="team-card team-2">
      <div class="team-header">
        <input type="text" id="team2Name" class="team-name-input" value="DUPLA 2" maxlength="25" />
        <span id="serve2" class="serve-indicator" onclick="toggleServe(2)" title="Alternar Saque">🎾</span>
      </div>
      <div class="games-row">
        <span>GAMES:</span>
        <span class="games-val" id="team2Games">0</span>
      </div>
      <div class="point-display" onclick="addPoint(2)">
        <span class="point-val" id="team2Points">0</span>
      </div>
      <button class="btn-score-add" onclick="addPoint(2)">+ PONTO (VOL -)</button>
    </div>
  </main>

  <footer>
    <div class="shortcuts-info">
      <span>Controle: <span class="badge">Vol +</span> / <span class="badge">A</span> Ponto D1</span>
      <span><span class="badge">Vol -</span> / <span class="badge">B</span> Ponto D2</span>
      <span><span class="badge">Play/Pause</span> / <span class="badge">Z</span> Desfazer</span>
      <span><span class="badge">S</span> Alternar Saque</span>
    </div>
    <div id="statusTieBreak" style="color: var(--accent-neon); font-weight: bold;">MODO: REGULAR (NO-AD)</div>
  </footer>

  <script>
    // Configurações e Estado da Partida
    const POINT_LABELS = ["0", "15", "30", "40"];
    let state = {
      p1Points: 0, // índice 0, 1, 2, 3
      p2Points: 0,
      p1Games: 0,
      p2Games: 0,
      server: 1,
      isTieBreak: false,
      history: []
    };

    // Prevenção de suspensão da tela do Tablet (Screen Wake Lock API)
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(() => {});
    }

    function saveState() {
      state.history.push(JSON.stringify({
        p1Points: state.p1Points,
        p2Points: state.p2Points,
        p1Games: state.p1Games,
        p2Games: state.p2Games,
        server: state.server,
        isTieBreak: state.isTieBreak
      }));
      if (state.history.length > 50) state.history.shift();
    }

    function undoLastAction() {
      if (state.history.length === 0) return;
      const last = JSON.parse(state.history.pop());
      state.p1Points = last.p1Points;
      state.p2Points = last.p2Points;
      state.p1Games = last.p1Games;
      state.p2Games = last.p2Games;
      state.server = last.server;
      state.isTieBreak = last.isTieBreak;
      updateUI();
    }

    function addPoint(team) {
      saveState();

      if (!state.isTieBreak) {
        // Regras Beach Tennis Tradicional (No-Ad: 40-40 é ponto decisivo)
        if (team === 1) {
          if (state.p1Points === 3) {
            winGame(1);
          } else {
            state.p1Points++;
          }
        } else {
          if (state.p2Points === 3) {
            winGame(2);
          } else {
            state.p2Points++;
          }
        }
      } else {
        // Tie-break (vai a 7 pontos com diferença de 2)
        if (team === 1) state.p1Points++;
        else state.p2Points++;

        // Alternância de saque no Tie-break (após o 1º ponto e depois a cada 2 pontos)
        const totalPoints = state.p1Points + state.p2Points;
        if (totalPoints % 2 === 1) {
          state.server = state.server === 1 ? 2 : 1;
        }

        if (state.p1Points >= 7 && (state.p1Points - state.p2Points >= 2)) {
          state.p1Games++;
          alert(`Fim do Set! Vitória de ${document.getElementById('team1Name').value}`);
        } else if (state.p2Points >= 7 && (state.p2Points - state.p1Points >= 2)) {
          state.p2Games++;
          alert(`Fim do Set! Vitória de ${document.getElementById('team2Name').value}`);
        }
      }

      updateUI();
    }

    function winGame(winnerTeam) {
      state.p1Points = 0;
      state.p2Points = 0;
      if (winnerTeam === 1) state.p1Games++;
      else state.p2Games++;

      // Alterna sacador do game
      state.server = state.server === 1 ? 2 : 1;

      // Condição de Tie-Break (6 x 6)
      if (state.p1Games === 6 && state.p2Games === 6) {
        state.isTieBreak = true;
      } else if ((state.p1Games >= 6 || state.p2Games >= 6) && Math.abs(state.p1Games - state.p2Games) >= 2) {
        const winnerName = winnerTeam === 1 ? document.getElementById('team1Name').value : document.getElementById('team2Name').value;
        alert(`Fim de jogo! Vitória de ${winnerName}!`);
      }
    }

    function toggleServe(team) {
      saveState();
      state.server = team;
      updateUI();
    }

    function updateUI() {
      // Exibição de pontos
      if (!state.isTieBreak) {
        document.getElementById('team1Points').innerText = POINT_LABELS[state.p1Points];
        document.getElementById('team2Points').innerText = POINT_LABELS[state.p2Points];
        document.getElementById('statusTieBreak').innerText = "MODO: REGULAR (NO-AD)";
      } else {
        document.getElementById('team1Points').innerText = state.p1Points;
        document.getElementById('team2Points').innerText = state.p2Points;
        document.getElementById('statusTieBreak').innerText = "MODO: TIE-BREAK (ATÉ 7)";
      }

      // Exibição de games
      document.getElementById('team1Games').innerText = state.p1Games;
      document.getElementById('team2Games').innerText = state.p2Games;

      // Indicadores de saque
      document.getElementById('serve1').className = 'serve-indicator' + (state.server === 1 ? ' active' : '');
      document.getElementById('serve2').className = 'serve-indicator' + (state.server === 2 ? ' active' : '');
    }

    function resetMatch() {
      if (!confirm("Deseja realmente zerar o placar da partida?")) return;
      saveState();
      state.p1Points = 0;
      state.p2Points = 0;
      state.p1Games = 0;
      state.p2Games = 0;
      state.isTieBreak = false;
      state.server = 1;
      updateUI();
    }

    // Exportação da Súmula para Excel (.xls / .xlsx)
    function exportToExcel() {
      const t1 = document.getElementById('team1Name').value;
      const t2 = document.getElementById('team2Name').value;
      const now = new Date().toLocaleString('pt-BR');

      const data = [
        ["SÚMULA BEACH TENNIS - R12 BEACH SPORTS", ""],
        ["Data/Hora do Registro:", now],
        ["", ""],
        ["Dupla", "Games", "Pontuação Vigente", "Sacador"],
        [t1, state.p1Games, !state.isTieBreak ? POINT_LABELS[state.p1Points] : state.p1Points, state.server === 1 ? "SIM" : "NÃO"],
        [t2, state.p2Games, !state.isTieBreak ? POINT_LABELS[state.p2Points] : state.p2Points, state.server === 2 ? "SIM" : "NÃO"],
        ["", ""],
        ["Situação:", state.isTieBreak ? "Tie-break em andamento" : "Jogo regular"]
      ];

      const ws = XLSX.utils.aoa_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Placar");

      const fileName = `Placar_BeachTennis_${t1}_vs_${t2}_${Date.now()}.xls`;
      XLSX.writeFile(wb, fileName);
    }

    // Tratamento de Erro / Fallback do Logo
    function handleLogoError(imgElement) {
      imgElement.style.display = 'none';
      document.getElementById('logoFallback').style.display = 'block';
    }

    // Carregamento manual de imagem do logo (caso queira usar arquivo local)
    document.getElementById('logoFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const img = document.getElementById('clubLogo');
          img.src = evt.target.result;
          img.style.display = 'block';
          document.getElementById('logoFallback').style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    });

    // Mapeamento de Teclado e Controles Remotos Bluetooth
    window.addEventListener('keydown', (e) => {
      // Ignora se estiver digitando o nome das duplas
      if (e.target.tagName === 'INPUT') return;

      const key = e.key.toLowerCase();

      // Ponto Dupla 1: Letra A, Seta Cima/Esquerda, Page Up, Volume Up
      if (key === 'a' || key === 'arrowup' || key === 'arrowleft' || key === 'pageup' || key === 'volumeup') {
        e.preventDefault();
        addPoint(1);
      }
      // Ponto Dupla 2: Letra B, Seta Baixo/Direita, Page Down, Volume Down
      else if (key === 'b' || key === 'arrowdown' || key === 'arrowright' || key === 'pagedown' || key === 'volumedown') {
        e.preventDefault();
        addPoint(2);
      }
      // Voltar Ponto (Undo): Tecla Z, Backspace, Barra de Espaço ou Tecla Play/Pause
      else if (key === 'z' || key === 'backspace' || key === ' ' || key === 'mediaplaypause') {
        e.preventDefault();
        undoLastAction();
      }
      // Alternar Saque: Tecla S
      else if (key === 's') {
        e.preventDefault();
        toggleServe(state.server === 1 ? 2 : 1);
      }
    });
  </script>
</body>
</html>
